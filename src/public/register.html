<body>

  <h1 id = "bem_vindo">Bem vindo</h1>

    <div class="gm">

      <input type="text", id = "input_gm">
    </div>

    <div class = "key">
      <label id = "label_senha" for="input_gm">Sua Senha</label>
      <input type="password", id = "input_senha">
    </div>
        <div class = "nome">

      <label id = "label_nome" for="input_gm">Seu nome</label>
      <input id = "input_nome" type="text">

    </div>
  <button id="butao" onclick="pegarSenha('#input_gm', '#input_senha', '#input_nome')">Criar</button>
</div>
